<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBX Automator Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #07090e; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: rgba(15, 23, 42, 0.85); border: 1px solid #0284c744; border-radius: 14px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(2, 132, 199, 0.25); }
        h2 { margin-top: 0; color: #38bdf8; font-size: 20px; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #07090e; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        button { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; font-size: 15px; box-shadow: 0 0 12px rgba(2, 132, 199, 0.4); }
        button:hover { box-shadow: 0 0 20px rgba(56, 189, 248, 0.8); }
        #logArea { margin-top: 15px; background: #07090e; padding: 10px; border-radius: 8px; border: 1px solid #334155; height: 120px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #22c55e; }
        #containerBox { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>GBX Automator Pro</h2>
        <label>Target URL / Link</label>
        <input type="text" id="targetUrl" placeholder="https://example.com">
        
        <label>Target Views / Count</label>
        <input type="number" id="targetCount" placeholder="e.g. 50" value="10">

        <button onclick="startProcess()">Start Execution</button>

        <div id="logArea">Logs will appear here...</div>
        <div id="containerBox"></div>
    </div>

    <script>
        function log(msg) {
            const area = document.getElementById('logArea');
            area.innerHTML += msg + "<br>";
            area.scrollTop = area.scrollHeight;
        }

        function startProcess() {
            const url = document.getElementById('targetUrl').value.trim();
            const count = parseInt(document.getElementById('targetCount').value) || 0;
            const container = document.getElementById('containerBox');
            
            container.innerHTML = "";
            if (!url) {
                alert("Please enter a valid URL!");
                return;
            }

            log(`[INFO] Initializing task for: ${url}`);
            log(`[INFO] Target count set to: ${count}`);

            let spawned = 0;

            const interval = setInterval(() => {
                if (spawned >= count) {
                    clearInterval(interval);
                    log(`[SUCCESS] Task completed. All instances processed.`);
                    return;
                }

                spawned++;
                let frameId = `frame_${spawned}`;
                log(`[RUNNING] Triggering instance #${spawned}...`);

                let iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.display = "none";
                iframe.id = frameId;
                
                container.appendChild(iframe);

                setTimeout(() => {
                    let el = document.getElementById(frameId);
                    if (el) {
                        el.remove();
                        log(`[CLEANUP] Instance #${spawned} cleared.`);
                    }
                }, 3000);

            }, 800);
        }
    </script>
</body>
</html>
